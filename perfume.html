<!DOCTYPE html>
<html lang="es">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
   
    <script src="js/version.js"></script>
    <script>
        function versioned(path) {
            return path + "?v=" + APP_VERSION;
        }
    </script>

    <script>
        document.write('<link rel="stylesheet" href="' + versioned('css/base.css') + '">');
        document.write('<link rel="stylesheet" href="' + versioned('css/layout.css') + '">');
        document.write('<link rel="stylesheet" href="' + versioned('css/components.css') + '">');

        document.write('<link rel="stylesheet" href="' + versioned('css/admin.css') + '">');

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

<body>

    <!-- NAVBAR SIMPLE -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html" class="logo-link">INICIO</a>
        </div>
    </header>

    <main class="container">
        <section class="perfume-detail" id="perfumeDetail">
            <!-- Se renderiza dinámicamente -->
        </section>
        
    </main>
    <button id="scrollTopBtn" class="scroll-top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <a href="carrito.html" class="cart-floating">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 
                    2 1.61h9.72a2 2 0 0 0 
                    2-1.61L23 6H6"></path>
        </svg>
        <span id="cartCount" class="cart-count">0</span>
    </a>


    <script>
        document.write('<script src="' + versioned('data/iconsUso.js') + '"><\/script>');
        document.write('<script src="' + versioned('data/notas.js') + '"><\/script>');

        document.write('<script src="' + versioned('data/perfumes.js') + '"><\/script>');

        document.write('<script src="' + versioned('js/catalogo.js') + '"><\/script>');
        document.write('<script src="' + versioned('js/detalle.js') + '"><\/script>');
